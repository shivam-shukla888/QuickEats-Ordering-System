name: QuickEats CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Backend Tests
        run: mvn clean test -B

  frontend-build:
    name: Frontend Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './QuickEats-Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd QuickEats-Frontend
          npm ci

      - name: Build React Frontend Bundle
        run: |
          cd QuickEats-Frontend
          npm run build
