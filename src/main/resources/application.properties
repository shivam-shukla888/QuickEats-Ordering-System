spring.application.name=quickeats
server.port=${PORT:8080}

# Database Configuration (H2 default, PostgreSQL/MySQL override)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:quickeatsdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# MySQL Database Configuration (for production)
# Uncomment these lines to use MySQL instead of H2
# spring.datasource.url=jdbc:mysql://localhost:3306/quickeats_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=${DB_PASSWORD:}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Logging Configuration
logging.level.com.quickeats=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081}

# Spring Boot Actuator Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Groq AI Configuration (Set GROQ_API_KEY environment variable)
groq.api.key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
groq.model-name=llama-3.1-8b-instant

# Firebase FCM Configuration (Placeholders for deployment / service account path)
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
firebase.project-id=${FIREBASE_PROJECT_ID:quickeats-2e295}
