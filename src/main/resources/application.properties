spring.application.name=quickeats
server.port=${PORT:8080}

# Database Configuration (H2 in-memory default; auto-detects PostgreSQL / MySQL when SPRING_DATASOURCE_URL is overridden in cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:quickeatsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:${DB_PASSWORD:password}}}
spring.h2.console.enabled=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Logging Configuration
logging.level.com.quickeats=INFO
logging.level.org.springframework.security=INFO

# JWT Configuration (Secret must be set via JWT_SECRET env var in production or dev profile active)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://quickeats-sandy.vercel.app}

# Spring Boot Actuator Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Groq AI Configuration (Set GROQ_API_KEY environment variable)
groq.api.key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
groq.model-name=llama-3.1-8b-instant

# Firebase FCM Configuration (Placeholders for deployment / service account path)
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
firebase.project-id=${FIREBASE_PROJECT_ID:quickeats-2e295}
